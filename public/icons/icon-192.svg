<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bucketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <clipPath id="bucketClip">
      <path d="M52 85 L140 85 L132 155 Q131 162 124 162 L68 162 Q61 162 60 155 Z"/>
    </clipPath>
  </defs>
  <!-- Dark background circle -->
  <circle cx="96" cy="96" r="90" fill="#0d0d0d"/>
